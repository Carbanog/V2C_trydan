blueprint:
  name: V2C Trydan - Charging session notifications
  description: >-
    Runs configurable actions when the first charge starts and when the cable is
    disconnected. The finish action can use session_kwh, estimated_percent,
    session_seconds, session_hours, session_duration, estimated_cost, and
    estimated_range_km as template variables. Repeated OCPP pauses do not create
    repeated start notifications because the start path is tied to a new cable
    connection.
  domain: automation
  source_url: https://github.com/Carbanog/V2C_trydan/blob/v1.3.0/blueprints/automation/session_summary.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    cable_connected:
      name: Cable connected
      selector:
        entity:
          filter:
            domain: binary_sensor
            device_class: plug
    charging:
      name: Charging
      selector:
        entity:
          filter:
            domain: binary_sensor
            device_class: battery_charging
    session_energy:
      name: Session energy
      selector:
        entity:
          filter:
            domain: sensor
            device_class: energy
    session_active_time:
      name: Session active charging time
      description: Select the accumulated session time, not the raw segment time.
      selector:
        entity:
          filter:
            domain: sensor
            device_class: duration
    battery_capacity:
      name: Usable battery capacity
      description: Set to 0 to disable the estimated percentage.
      default: 0
      selector:
        number:
          min: 0
          max: 250
          step: 0.1
          unit_of_measurement: kWh
          mode: box
    charging_efficiency:
      name: Charging efficiency
      default: 90
      selector:
        number:
          min: 50
          max: 100
          step: 1
          unit_of_measurement: "%"
    electricity_price:
      name: Electricity price
      description: Set to 0 to disable the estimated cost.
      default: 0
      selector:
        number:
          min: 0
          max: 2
          step: 0.001
          unit_of_measurement: EUR/kWh
          mode: box
    vehicle_efficiency:
      name: Vehicle efficiency
      description: Set to 0 to disable the estimated range.
      default: 0
      selector:
        number:
          min: 0
          max: 15
          step: 0.1
          unit_of_measurement: km/kWh
          mode: box
    start_actions:
      name: Charge started actions
      description: Actions can use the standard trigger variables.
      default: []
      selector:
        action:
    finish_actions:
      name: Session finished actions
      description: >-
        Actions can use session_kwh, session_seconds, session_hours,
        session_duration, estimated_percent, estimated_cost, and
        estimated_range_km in templates.
      default: []
      selector:
        action:

triggers:
  - trigger: state
    entity_id: !input cable_connected
    from: "off"
    to: "on"
    id: connected
  - trigger: state
    entity_id: !input cable_connected
    from: "on"
    to: "off"
    for:
      minutes: 2
    id: disconnected

variables:
  cable_entity: !input cable_connected
  charging_entity: !input charging
  session_entity: !input session_energy
  session_time_entity: !input session_active_time
  capacity_kwh: !input battery_capacity
  efficiency_percent: !input charging_efficiency
  price_per_kwh: !input electricity_price
  range_per_kwh: !input vehicle_efficiency

actions:
  - choose:
      - conditions: "{{ trigger.id == 'connected' }}"
        sequence:
          - wait_template: >-
              {{ is_state(charging_entity, 'on') or
                 is_state(cable_entity, 'off') }}
            timeout:
              hours: 24
            continue_on_timeout: false
          - condition: template
            value_template: "{{ is_state(charging_entity, 'on') }}"
          - sequence: !input start_actions
      - conditions: "{{ trigger.id == 'disconnected' }}"
        sequence:
          - variables:
              session_kwh: "{{ states(session_entity) | float(0) | round(2) }}"
              session_seconds: >-
                {% set factors = {'ms': 0.001, 's': 1, 'min': 60,
                                  'h': 3600, 'd': 86400} %}
                {% set unit = state_attr(session_time_entity,
                                         'unit_of_measurement') %}
                {{ ((states(session_time_entity) | float(0)) *
                    factors.get(unit, 1)) | round(0) }}
              session_hours: >-
                {{ ((session_seconds | float(0)) / 3600) | round(2) }}
              session_duration: >-
                {% set total = session_seconds | int(0) %}
                {% set hours = total // 3600 %}
                {% set minutes = (total % 3600) // 60 %}
                {{ '%d h %02d min' | format(hours, minutes) }}
              estimated_percent: >-
                {{ (((session_kwh | float(0)) *
                     ((efficiency_percent | float(90)) / 100) /
                     (capacity_kwh | float) * 100) | round(1))
                   if capacity_kwh | float(0) > 0 else none }}
              estimated_cost: >-
                {{ (((session_kwh | float(0)) * (price_per_kwh | float)) | round(2))
                   if price_per_kwh | float(0) > 0 else none }}
              estimated_range_km: >-
                {{ (((session_kwh | float(0)) *
                     ((efficiency_percent | float(90)) / 100) *
                     (range_per_kwh | float)) | round(0))
                   if range_per_kwh | float(0) > 0 else none }}
          - sequence: !input finish_actions

mode: parallel
max: 4
