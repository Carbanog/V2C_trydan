# Replace entity IDs if Home Assistant generated different names in your system.
type: vertical-stack
cards:
  - type: heading
    heading: V2C Trydan charger
    icon: mdi:ev-station
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: sensor.v2c_trydan_charge_state
        name: Status
      - type: tile
        entity: sensor.v2c_trydan_charge_power
        name: Charging power
      - type: tile
        entity: sensor.v2c_trydan_session_energy
        name: Session energy
      - type: tile
        entity: sensor.v2c_trydan_charge_time
        name: Charging time
      - type: tile
        entity: binary_sensor.v2c_trydan_cable_connected
        name: Cable
      - type: tile
        entity: binary_sensor.v2c_trydan_charging
        name: Charging
  - type: history-graph
    title: Power during the last 8 hours
    hours_to_show: 8
    entities:
      - entity: sensor.v2c_trydan_house_power
        name: Home
      - entity: sensor.v2c_trydan_charge_power
        name: Car
  - type: entities
    title: Controls
    show_header_toggle: false
    entities:
      - entity: switch.v2c_trydan_pause_charge
      - entity: switch.v2c_trydan_lock_charger
      - entity: number.v2c_trydan_charge_intensity
      - entity: light.v2c_trydan_charger_light
      - entity: light.v2c_trydan_logo_light
  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.v2c_trydan_meter_problem
        state: "on"
    card:
      type: tile
      entity: binary_sensor.v2c_trydan_meter_problem
      name: Check charger meter
      color: red
