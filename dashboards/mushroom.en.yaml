# Requires Mushroom and Mini Graph Card. Replace IDs generated differently.
type: vertical-stack
cards:
  - type: heading
    heading: V2C Trydan charger
    icon: mdi:ev-station
  - type: horizontal-stack
    cards:
      - type: custom:mushroom-entity-card
        entity: sensor.v2c_trydan_house_power
        name: Home
        icon: mdi:home-lightning-bolt
        icon_color: blue
      - type: custom:mushroom-entity-card
        entity: sensor.v2c_trydan_charge_power
        name: Car
        icon: mdi:ev-station
        icon_color: green
  - type: custom:mushroom-template-card
    entity: sensor.v2c_trydan_charge_state
    primary: >-
      {% if is_state('binary_sensor.v2c_trydan_charging', 'on') %}
        Charging at {{ states('sensor.v2c_trydan_charge_power') }} W
      {% elif is_state('binary_sensor.v2c_trydan_cable_connected', 'on') %}
        Connected · Waiting
      {% else %}
        Cable disconnected
      {% endif %}
    secondary: >-
      Session: {{ states('sensor.v2c_trydan_session_energy') }} kWh ·
      Current: {{ states('number.v2c_trydan_charge_intensity') }} A
    icon: mdi:car-electric
    icon_color: >-
      {% if is_state('binary_sensor.v2c_trydan_charging', 'on') %}green
      {% elif is_state('binary_sensor.v2c_trydan_cable_connected', 'on') %}blue
      {% else %}grey{% endif %}
    tap_action:
      action: more-info
  - type: custom:mini-graph-card
    name: Power during the last 8 hours
    hours_to_show: 8
    points_per_hour: 12
    line_width: 3
    entities:
      - entity: sensor.v2c_trydan_house_power
        name: Home
        color: "#3498db"
      - entity: sensor.v2c_trydan_charge_power
        name: Car
        color: "#2ecc71"
    show:
      extrema: true
      fill: fade
  - type: entities
    title: Controls and session
    show_header_toggle: false
    entities:
      - entity: sensor.v2c_trydan_session_energy
      - entity: switch.v2c_trydan_pause_charge
      - entity: switch.v2c_trydan_lock_charger
      - entity: number.v2c_trydan_charge_intensity
      - entity: light.v2c_trydan_logo_light
  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.v2c_trydan_meter_problem
        state: "on"
    card:
      type: custom:mushroom-entity-card
      entity: binary_sensor.v2c_trydan_meter_problem
      name: Meter problem
      icon_color: red
