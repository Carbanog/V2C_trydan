name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Test
        run: pytest

  hassfest:
    name: Home Assistant validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361

  integration:
    name: Home Assistant scheduling tests (${{ matrix.ha }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ha: [baseline, current]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_ha_test.txt
            requirements_ha_current.txt
      - name: Install HA test environment
        if: matrix.ha == 'baseline'
        run: python -m pip install -r requirements_ha_test.txt
      - name: Install current HA compatibility environment
        if: matrix.ha == 'current'
        run: |
          python -m pip install uv==0.13.7
          uv pip install --system -r requirements_ha_test.txt --override requirements_ha_current.txt
      - name: Exercise options, setup, entities and unload with real HA
        # HA 2026.11 installs its httpx2 alias at import. Import it before the
        # older fixture/plugin collection imports httpx, matching HA startup.
        run: >-
          python -c "import homeassistant; import pytest;
          raise SystemExit(pytest.main(['tests_ha', '-vv', '--tb=short',
          '--timeout=60', '--timeout-method=thread', '-o', 'asyncio_mode=auto']))"

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
